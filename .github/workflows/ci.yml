name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: '1.4.0'
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check
        run: vp check --deny-warnings

      - name: Test
        run: vp test

      - name: Build
        run: vp run build

      # Rebuild the registry and fail if the committed public/r output has
      # drifted from the sources — public/r is what users install from.
      - name: Registry output is up to date
        run: |
          vp run registry:build
          git diff --exit-code -- public/r || {
            echo "::error::public/r is stale — run 'vp run registry:build' and commit the result"
            exit 1
          }
